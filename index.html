<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon-32x32.png" />
    <title>Akhmad Prasetya Atmanegara</title>
    <meta
      name="description"
      content="Akhmad Prasetya Atmanegara - AWS Certified DevOps Engineer. Links, portfolio, and projects."
    />
    <meta property="og:title" content="Akhmad Prasetya Atmanegara" />
    <meta
      property="og:description"
      content="AWS Certified | DevOps Engineer — links, portfolio, and projects."
    />
    <meta property="og:image" content="https://akhmadprasetya.com/meta/thumbnail_new.jpg" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #b9c5ff;
        --on-primary: #101b4d;
        --primary-container: #29366d;
        --on-primary-container: #e0e5ff;
        --secondary: #c5c5d0;
        --surface: #111318;
        --surface-container: #1d1e24;
        --surface-variant: #45464f;
        --on-surface: #e4e1e9;
        --on-surface-variant: #c5c5d0;
        --outline: #8f9099;
        --space-2: 0.75rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --space-5: 2rem;
        --space-6: 3rem;
        --radius-sm: 0.75rem;
        --radius-md: 1rem;
        --radius-lg: 1.75rem;
        --shadow-1: 0 2px 8px #0005;
        --shadow-2: 0 12px 32px #0006;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --duration-fast: 160ms;
        --duration-normal: 250ms;
        --duration-slow: 400ms;
      }

      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--on-surface);
        font: 400 1rem/1.6 "DM Sans", sans-serif;
        overflow-x: hidden;
        padding: var(--space-6, 3rem) var(--space-3);
        background: radial-gradient(
            circle at 95% 15%,
            #29366d55,
            transparent 35%
          ),
          var(--surface);
      }

      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        max-width: 480px;
        animation: riseIn var(--duration-slow) var(--ease-out) both;
      }

      .avatar {
        width: 9rem;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: var(--radius-lg);
        border: 2px solid var(--primary);
        box-shadow: var(--shadow-2);
        margin-bottom: var(--space-4);
        transition: transform var(--duration-fast) var(--ease-out);
      }

      @media (hover: hover) and (pointer: fine) {
        .avatar:hover {
          transform: translateY(-2px);
        }
      }

      .eyebrow {
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(1.6rem, 5vw, 2.35rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-top: 0.4rem;
      }

      .role {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: var(--space-2);
        font-size: 0.9rem;
        color: var(--on-surface-variant);
      }

      .role::before,
      .role::after {
        content: "";
        height: 1px;
        width: 22px;
        background: currentColor;
        opacity: 0.5;
      }

      .links {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 400px;
        gap: var(--space-2);
        margin-top: var(--space-5);
      }

      .links a {
        min-height: 3rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0.75rem 1.25rem;
        background: var(--surface-container);
        color: var(--on-surface);
        text-decoration: none;
        border: 1px solid #8f909955;
        border-radius: 2rem;
        font-size: 0.92rem;
        font-weight: 600;
        line-height: 1.4;
        transition:
          background-color var(--duration-normal) var(--ease-out),
          border-color var(--duration-normal) var(--ease-out),
          box-shadow var(--duration-normal) var(--ease-out),
          transform var(--duration-fast) var(--ease-out);
        opacity: 0;
        animation: riseIn var(--duration-slow) var(--ease-out) forwards;
      }

      @media (hover: hover) and (pointer: fine) {
        .links a:hover {
          background: var(--primary-container);
          border-color: var(--primary);
          color: var(--on-primary-container);
          transform: translateY(-1px);
          box-shadow: var(--shadow-1);
        }
        .links a:hover .arrow {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .links a:active {
        transform: scale(0.97);
      }

      .links a:focus-visible,
      .links a:focus {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }

      .links a span:first-child {
        flex: 1;
      }

      .links a .arrow {
        flex: none;
        opacity: 0;
        transform: translateX(-4px);
        transition:
          opacity var(--duration-fast) var(--ease-out),
          transform var(--duration-fast) var(--ease-out);
      }

      .links a:nth-child(1) { animation-delay: 120ms; }
      .links a:nth-child(2) { animation-delay: 180ms; }
      .links a:nth-child(3) { animation-delay: 240ms; }
      .links a:nth-child(4) { animation-delay: 300ms; }
      .links a:nth-child(5) { animation-delay: 360ms; }
      .links a:nth-child(6) { animation-delay: 420ms; }

      footer {
        margin-top: var(--space-5);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        color: var(--on-surface-variant);
        animation: fadeIn var(--duration-slow) 550ms var(--ease-out) both;
      }

      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(0.65rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      #loading {
        position: fixed;
        z-index: 999;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        gap: 12px;
        color: var(--on-surface);
      }

      #loading::before {
        content: "";
        height: 2em;
        width: 2em;
        border-radius: 50%;
        border: 0.25em solid var(--surface-variant);
        border-top-color: var(--primary);
        animation: load 0.75s infinite linear;
      }

      @keyframes load {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .profile,
        .links a,
        footer {
          animation-duration: 200ms;
          animation-delay: 0ms;
        }
        @keyframes riseIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .avatar,
        .links a,
        .links a .arrow {
          transition-duration: 100ms;
        }
      }
    </style>
    <script>
      window.addEventListener("load", function () {
        var loader = document.getElementById("loading");
        if (loader) {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 150ms ease-out";
          setTimeout(function () {
            loader.remove();
          }, 150);
        }
      });
    </script>
  </head>
  <body>
    <div id="loading">
      <div class="text">Loading</div>
    </div>

    <main class="profile">
      <img class="avatar" src="saya.png" alt="Portrait of Akhmad Prasetya Atmanegara" />
      <p class="eyebrow">AWS Certified · DevOps Engineer</p>
      <h1>Akhmad Prasetya Atmanegara</h1>
      <p class="role">Welcome to my corner of the internet</p>
    </main>

    <nav class="links" aria-label="Social and project links">
      <a href="https://instagram.com/leftprazz" target="_blank" rel="noopener noreferrer">
        <span>Instagram</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://portfolio.akhmadprasetya.com" target="_blank" rel="noopener noreferrer">
        <span>Web Portfolio</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://games.akhmadprasetya.com" target="_blank" rel="noopener noreferrer">
        <span>Boring? Try my simple game — native JS, HTML, CSS</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://github.com/leftprazz" target="_blank" rel="noopener noreferrer">
        <span>GitHub</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://www.linkedin.com/in/akhmadprasetya27/" target="_blank" rel="noopener noreferrer">
        <span>LinkedIn</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://songwhip.com/lastvoice" target="_blank" rel="noopener noreferrer">
        <span>Stream Last Voice — Spotify, iTunes, etc</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer>© <span id="year">2026</span> Akhmad Prasetya Atmanegara</footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
